version: '3.8'

services:
  misconfig-team1:
    build:
      context: ./teams/team1
      args:
        FLAG_REDIS: ${FLAG_REDIS_1:-FEIT{team1_redis_noauth_flag_default}}
        FLAG_MEMCACHED: ${FLAG_MEMCACHED_1:-FEIT{team1_memcached_flag_default}}
    container_name: misconfig-team1
    networks:
      team1_net:
        ipv4_address: 10.10.1.60
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  misconfig-team2:
    build:
      context: ./teams/team2
      args:
        FLAG_REDIS: ${FLAG_REDIS_2:-FEIT{team2_redis_noauth_flag_default}}
