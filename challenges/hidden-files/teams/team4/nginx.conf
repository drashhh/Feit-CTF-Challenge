worker_processes 1;
events { worker_connections 1024; }
http {
    include mime.types;
    default_type application/octet-stream;
    server {
        listen 80;
        server_name localhost;
        
        # Hide nginx version
        server_tokens off;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
        
        # Explicitly allow access to secret dir
        location /secret/ {
            root /usr/share/nginx/html;
            autoindex on;
        }
    }
}
