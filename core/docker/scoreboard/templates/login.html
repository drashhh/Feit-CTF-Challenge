<!DOCTYPE html>
<html>
<head>
    <title>FEIT CTF - Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 80px auto; padding: 20px; background: #1a1a2e; color: #eee; }
        .container { background: #16213e; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #0f3460; background: #e94560; padding: 10px; border-radius: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #0f3460; border-radius: 4px; background: #1a1a2e; color: #eee; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #c73e54; }
        .flash { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .flash.error { background: #ff4444; color: white; }
        .flash.success { background: #44ff44; color: black; }
        .flash.warning { background: #ffaa00; color: black; }
        a { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FEIT CTF</h1>
        <h2 style="text-align:center;">Team Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <label>Team Name:</label>
            <input type="text" name="team" placeholder="e.g., team1" required>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter team password" required>
            <button type="submit">Login</button>
        </form>
        <p style="text-align:center; margin-top:20px;"><a href="/scoreboard">View Scoreboard</a></p>
    </div>
</body>
</html>
